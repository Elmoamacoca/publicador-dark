name: agendar

# Agendamento em lote. Disparado pelo botao Lote do painel, ou aqui na mao.
# Espalha os videos de midia/ pelas contas ativas, aplicando desvio de horario,
# legenda unica e curva de aquecimento.
on:
  workflow_dispatch:
    inputs:
      inicio:
        description: "Data inicial, AAAA-MM-DD"
        required: true
      horarios:
        description: "Horarios por dia, separados por virgula"
        required: true
        default: "09:00,13:00,19:00"
      dias:
        description: "Dias da semana"
        required: true
        default: "seg,ter,qua,qui,sex,sab,dom"
      simular:
        description: "Só mostrar, sem gravar"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  agendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: montar a grade
        working-directory: publicador
        env:
          INPUT_INICIO: ${{ inputs.inicio }}
          INPUT_HORARIOS: ${{ inputs.horarios }}
          INPUT_DIAS: ${{ inputs.dias }}
          INPUT_SIMULAR: ${{ inputs.simular }}
        run: |
          if [ "$INPUT_SIMULAR" = "true" ]; then
            SIM_FLAG="--simular"
          else
            SIM_FLAG=""
          fi
          python agendar.py \
            --inicio  "$INPUT_INICIO" \
            --horarios "$INPUT_HORARIOS" \
            --dias     "$INPUT_DIAS" \
            $SIM_FLAG

      - name: gravar a agenda
        if: ${{ !inputs.simular }}
        env:
          INPUT_INICIO: ${{ inputs.inicio }}
        run: |
          git config user.name  "agendador"
          git config user.email "agendador@users.noreply.github.com"
          git add dados/
          git diff --staged --quiet || (git commit -m "lote a partir de $INPUT_INICIO" && git pull --rebase && git push)
