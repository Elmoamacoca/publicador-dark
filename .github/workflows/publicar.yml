name: publicar

# RELOGIO DESLIGADO EM 29/08/2026. Continua disparavel na mao, e so'.
#
# Por que: rodava de 5 em 5 minutos, 24 horas por dia, sobre `dados/agenda.json`, que
# nao tem saida marcada nenhuma, com segredos que nao existem no repositorio. Ou seja:
# 288 rodadas por dia sem publicar nada. Quem vai publicar de verdade e' a esteira, na
# VPS, quando a Ferramenta 1 entregar o lote.
#
# A decisao de arquitetura que isso obedece: o GitHub e' repositorio e deploy, nao
# e' runtime.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: publicar o que venceu
        working-directory: publicador
        env:
          # Um segredo por conta. O nome tem que bater com o campo
          # segredo_token de dados/contas.json.
          IG_TOKEN_CONTA1: ${{ secrets.IG_TOKEN_CONTA1 }}
          IG_TOKEN_CONTA2: ${{ secrets.IG_TOKEN_CONTA2 }}
          IG_TOKEN_CONTA3: ${{ secrets.IG_TOKEN_CONTA3 }}
        run: python publicar.py

      - name: gravar o resultado de volta
        run: |
          git config user.name  "publicador"
          git config user.email "publicador@users.noreply.github.com"
          git add dados/
          git diff --staged --quiet || (git commit -m "publicacao: $(date -u +%FT%TZ)" && git pull --rebase && git push)
