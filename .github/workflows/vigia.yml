name: vigia

# De hora em hora pergunta a Meta se cada conta ainda responde.
# Token morto ou permissao negada vira alarme vermelho no painel.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: checar as contas
        working-directory: publicador
        env:
          IG_TOKEN_CONTA1: ${{ secrets.IG_TOKEN_CONTA1 }}
          IG_TOKEN_CONTA2: ${{ secrets.IG_TOKEN_CONTA2 }}
          IG_TOKEN_CONTA3: ${{ secrets.IG_TOKEN_CONTA3 }}
        run: python vigia.py

      - name: gravar o estado
        run: |
          git config user.name  "vigia"
          git config user.email "vigia@users.noreply.github.com"
          git add dados/
          git diff --staged --quiet || git commit -m "vigia: $(date -u +%FT%TZ)"
          git push
