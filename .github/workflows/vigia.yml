name: vigia

# APOSENTADO EM 29/08/2026. O RELOGIO FOI DESLIGADO, o arquivo fica so' como historia.
#
# Por que: este vigia rodava de hora em hora contra `dados/contas.json`, que e' um
# arquivo de EXEMPLO (@exemplo1, @exemplo2), procurando tokens em segredos que nunca
# foram cadastrados (a API do GitHub confirmou: zero segredos no repositorio). Ele
# concluia "sem token", gravava o mesmo resultado de volta e comitava. Resultado
# medido em 29/08: 43 dos 51 ultimos commits eram dele, e o painel nunca leu esse
# arquivo.
#
# Quem vigia agora: `painel/contas.py`, na VPS, com os tokens de verdade. Ele
# pergunta a Meta, RENOVA o acesso sozinho antes de vencer e grava o resultado onde
# a tela le. Roda por cron na propria maquina, sem passar pelo GitHub.
#
# A decisao de arquitetura que isso obedece: o GitHub e' repositorio e deploy, nao
# e' runtime.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: checar as contas
        working-directory: publicador
        env:
          IG_TOKEN_CONTA1: ${{ secrets.IG_TOKEN_CONTA1 }}
          IG_TOKEN_CONTA2: ${{ secrets.IG_TOKEN_CONTA2 }}
          IG_TOKEN_CONTA3: ${{ secrets.IG_TOKEN_CONTA3 }}
        run: python vigia.py

      - name: gravar o estado
        run: |
          git config user.name  "vigia"
          git config user.email "vigia@users.noreply.github.com"
          git add dados/
          git diff --staged --quiet || (git commit -m "vigia: $(date -u +%FT%TZ)" && git pull --rebase && git push)
