<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Publicador Borusa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FAFAFA;--ink:#0E0E0E;--linha:#E4E4E4;--accent:#3F7D53;--erro:#B3402A}
  @media (prefers-color-scheme:dark){
    :root{--paper:#111311;--ink:#F2F2EF;--linha:#2A2D2A}
  }
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:grid;place-items:center;background:var(--paper);
       color:var(--ink);font:500 15px/1.5 Manrope,system-ui,sans-serif}
  .cartao{width:min(360px,92vw);padding:34px 30px;border:1px solid var(--linha);
          border-radius:18px;animation:entra .5s cubic-bezier(.22,1,.36,1)}
  @keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1}}
  h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .sub{opacity:.62;font-size:13px;margin:4px 0 22px}
  label{display:block;font-size:12px;font-weight:700;opacity:.75;margin:14px 0 5px}
  input{width:100%;padding:11px 13px;font:inherit;color:inherit;background:transparent;
        border:1px solid var(--linha);border-radius:10px;outline:none}
  input:focus{border-color:var(--accent)}
  button{width:100%;margin-top:20px;padding:12px;font:700 14px Manrope,sans-serif;
         color:#fff;background:var(--accent);border:0;border-radius:10px;cursor:pointer}
  button:hover{filter:brightness(1.07)}
  button[disabled]{opacity:.6;cursor:wait}
  .aviso{min-height:18px;margin-top:12px;font-size:12.5px;font-weight:700;
         color:var(--erro);text-align:center}
</style>
</head>
<body>
<form class="cartao" id="f">
  <h1>Publicador</h1>
  <p class="sub">Entre para abrir o painel.</p>
  <label for="u">Usuário</label>
  <input id="u" name="usuario" autocomplete="username" required autofocus>
  <label for="s">Senha</label>
  <input id="s" name="senha" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">Entrar</button>
  <p class="aviso" id="aviso"></p>
</form>
<script>
document.getElementById('f').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var b = document.getElementById('b'), aviso = document.getElementById('aviso');
  b.disabled = true; aviso.textContent = '';
  fetch('/entrar', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({usuario: document.getElementById('u').value,
                          senha: document.getElementById('s').value})
  }).then(function (r) { return r.json().then(function (d) { return [r.status, d]; }); })
    .then(function (par) {
      if (par[0] === 200) { location.href = '/'; return; }
      aviso.textContent = par[1].erro || 'nao deu certo, tente de novo';
      b.disabled = false;
    })
    .catch(function () { aviso.textContent = 'o servidor nao respondeu'; b.disabled = false; });
});
</script>
</body>
</html>
