<!doctype html>
<html lang="pt-BR" data-theme="light" data-menu="fechado">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Contas · Proposta B · Publicador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="painel.css">
<style>
/* ------------------------------------------------- PROPOSTA B: uma ficha por conta
   A tabela responde "quais contas existem". A ficha responde "esta conta está de pé?",
   que é a pergunta que se faz olhando conta por conta. Mesmas variáveis da casa. */
.fichas{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(370px,1fr))}
.ficha{background:var(--branco);border:1px solid var(--rule-solid);
       border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column;
       transition:border-color .18s, box-shadow .18s}
.ficha:hover{border-color:var(--soft);box-shadow:0 6px 22px rgba(14,14,14,.06)}
.ficha.caida{border-color:color-mix(in srgb,var(--vermelho) 40%,transparent)}

.ficha-cab{display:flex;align-items:center;gap:13px;padding:18px 18px 14px}
.ficha-cab .quem{min-width:0;flex:1}
.ficha-cab .nome{font-size:16px;font-weight:800;letter-spacing:-.2px}
.ficha-cab .pp{margin-top:2px}

/* O ANEL É O TETO DO DIA. Ele fica no cabeçalho porque é o número que decide se dá
   para programar mais alguma coisa hoje, e é o primeiro que se procura. */
.anel{width:56px;height:56px;flex:none;position:relative;display:grid;place-items:center}
.anel svg{position:absolute;inset:0;transform:rotate(-90deg)}
.anel circle{fill:none;stroke-width:5}
.anel .trilho{stroke:var(--paper-2)}
.anel .arco{stroke:var(--verde);stroke-linecap:round;
            transition:stroke-dasharray .5s cubic-bezier(.22,1,.36,1)}
.anel.meio .arco{stroke:var(--ambar)} .anel.cheio .arco{stroke:var(--vermelho)}
.anel b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.anel span{font-size:9.5px;color:var(--soft);line-height:1;margin-top:2px}
.anel .meio-texto{display:flex;flex-direction:column;align-items:center}

.ficha-num{display:grid;grid-template-columns:repeat(4,1fr);
           border-top:1px solid var(--rule-solid);
           border-bottom:1px solid var(--rule-solid)}
.ficha-num div{padding:13px 10px;text-align:center;
               border-left:1px solid color-mix(in srgb,var(--rule-solid) 60%,transparent)}
.ficha-num div:first-child{border-left:0}
.ficha-num b{display:block;font-size:19px;font-weight:700;letter-spacing:-.5px;
             font-variant-numeric:tabular-nums;line-height:1}
.ficha-num b.mau{color:var(--vermelho)}
.ficha-num span{display:block;font-size:11px;color:var(--soft);margin-top:5px}

.ficha-corpo{padding:16px 18px;display:flex;flex-direction:column;gap:14px;flex:1}
.ficha-linha{display:flex;align-items:center;gap:10px;font-size:13px}
.ficha-linha .rot{color:var(--muted);min-width:96px}
.ficha-linha .barra{flex:1;height:6px}
.ficha-linha b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.barra i.ruim{background:var(--vermelho)}

.tiras{display:flex;gap:6px}
.tira{flex:1;aspect-ratio:9/13;border-radius:7px;background:var(--paper-2);
      border:1px solid var(--rule-solid);position:relative;overflow:hidden;
      display:grid;place-items:end;cursor:pointer}
.tira:hover{border-color:var(--soft)}
.tira em{position:absolute;inset:auto 0 0 0;padding:5px 6px;font-style:normal;
         font-size:10px;font-weight:700;color:#fff;
         background:linear-gradient(transparent,rgba(0,0,0,.72))}
.tira.vazia{display:grid;place-items:center;font-size:10.5px;color:var(--soft);
            background:none;border-style:dashed}

.ficha-pe{display:flex;align-items:center;gap:8px;padding:14px 18px;
          border-top:1px solid var(--rule-solid);background:var(--paper-2)}
.ficha-pe .dir{margin-left:auto;display:flex;gap:7px}
.ic{width:34px;height:34px;border-radius:999px;border:1px solid var(--rule-solid);
    background:var(--branco);color:var(--muted);cursor:pointer;display:grid;
    place-items:center;padding:0;transition:.15s}
.ic:hover{border-color:var(--soft);color:var(--ink)}
.ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;
        stroke-linecap:round;stroke-linejoin:round}
.ic.girando svg{animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

.ficha .campo{border:1px dashed transparent;border-radius:8px;padding:3px 7px;margin:-3px -7px;
              cursor:text;font-size:13px;color:var(--ink);display:inline-flex;
              align-items:center;min-height:24px}
.ficha .campo:hover{border-color:var(--rule-solid);background:var(--paper-2)}
.ficha .campo.vazio{color:var(--soft)}
.ficha .campo input{border:0;background:none;font:inherit;color:var(--ink);outline:none;
                    width:130px;padding:0}
.ficha .etqs{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ficha .etq{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
            background:var(--accent-tint);color:var(--link);border-radius:999px;padding:3px 9px}
.ficha .etq button{border:0;background:none;color:inherit;cursor:pointer;padding:0;
                   font:inherit;opacity:.6;line-height:1}
.ficha .etq button:hover{opacity:1}
.ficha .etq-mais{border:1px dashed var(--rule-solid);background:none;color:var(--soft);
                 border-radius:999px;padding:3px 10px;font:inherit;font-size:11.5px;
                 cursor:pointer}
.ficha .etq-mais:hover{border-color:var(--soft);color:var(--ink)}

.ficha.simulada{border-style:dashed}
.ficha.simulada .ficha-cab .nome::after{content:"Simulada";margin-left:8px;font-size:9.5px;
  font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ambar);
  background:color-mix(in srgb,var(--ambar) 13%,transparent);padding:2px 7px;
  border-radius:999px;vertical-align:middle}
.pe-lista{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.pe-lista .dir{margin-left:auto}
</style>
</head>
<body>

<svg class="tinta" aria-hidden="true">
  <symbol id="i-seta" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></symbol>
  <symbol id="i-agenda" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/>
      <path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></g>
  </symbol>
</svg>

<aside class="menu" aria-label="Menu do Publicador">
  <div class="menu-marca">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
      <circle cx="14" cy="14" r="12" fill="none" stroke="var(--ink)" stroke-width="2.4"/>
      <circle cx="14" cy="14" r="4.6" fill="var(--accent)"/>
    </svg>
    <span class="menu-nome">Publicador</span>
  </div>
  <button class="menu-botao" id="botao-menu" aria-expanded="false"
          aria-label="Abrir ou fechar o menu">
    <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <nav class="menu-rolo">
    <button class="mi" data-pag="painel">
      <svg class="mi-ic" viewBox="0 0 24 24"><rect x="3" y="3.5" width="7.5" height="9" rx="1.6"/><rect x="13.5" y="3.5" width="7.5" height="5" rx="1.6"/><rect x="3" y="15.5" width="7.5" height="5" rx="1.6"/><rect x="13.5" y="11.5" width="7.5" height="9" rx="1.6"/></svg>
      <span class="mi-rot">Painel</span>
    </button>
    <button class="mi" data-pag="calendario">
      <svg class="mi-ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span class="mi-rot">Calendário</span>
    </button>
    <button class="mi" data-pag="midia">
      <svg class="mi-ic" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M7 5 6 9M13 5l-1 4M21.5 9h-19"/></svg>
      <span class="mi-rot">Mídia</span>
    </button>
    <button class="mi" data-pag="analytics">
      <svg class="mi-ic" viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="M8 16v-5M13 16V7M18 16v-8"/></svg>
      <span class="mi-rot">Analytics</span>
    </button>
    <button class="mi ativo" data-pag="contas">
      <svg class="mi-ic" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c0-3.7 3.3-6 7.5-6s7.5 2.3 7.5 6"/></svg>
      <span class="mi-rot">Contas</span>
    </button>
  </nav>
  <div class="menu-acao" style="padding:8px">
    <button class="btn brasa" type="button" aria-label="Programar publicações">
      <svg class="seta seta-esq" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
      <span class="txt"><svg class="ig-selo" aria-hidden="true"><use href="#i-agenda"/></svg>
        <span class="ag-rot">Programar</span></span>
      <span class="circ"></span>
      <svg class="seta seta-dir" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
    </button>
  </div>
  <div class="menu-pe">
    <button class="mi" data-pag="ajuda">
      <svg class="mi-ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.8-.9 1.4v.4"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
      <span class="mi-rot">Ajuda</span>
    </button>
    <div class="pe-linha">
      <span class="pp" style="font-weight:700">B</span>
      <span class="pe-rot">proposta</span>
    </div>
    <div class="pe-linha">
      <svg class="tema-icone" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      <span class="pe-rot">tema</span>
      <button class="chave" id="chave" role="switch" aria-checked="false"
              aria-label="Trocar tema"><i></i></button>
    </div>
  </div>
</aside>

<main class="palco">
<section class="pagina ativa" id="pag-contas">

  <div class="cab">
    <div>
      <h1>Contas</h1>
      <p class="p">Uma ficha por perfil, com a conexão perguntada à Meta.</p>
    </div>
    <div class="dir">
      <span class="pp" id="lido">conferido agora</span>
      <button class="bt mini" id="testar-todas">Testar Conexões</button>
      <button class="bt forte" id="ligar">Ligar Conta</button>
    </div>
  </div>

  <div class="filtros">
    <div class="ac">
      <div class="ac-campo">
        <svg class="ac-lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/>
             <path d="M20 20l-3.5-3.5"/></svg>
        <input id="busca" type="text" autocomplete="off" spellcheck="false"
               placeholder="Buscar conta pelo arroba">
        <button class="ac-limpar" id="limpar" type="button" hidden aria-label="Limpar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <button class="chip on" data-f="">Todas</button>
    <button class="chip" data-f="Viva">Conexão Viva</button>
    <button class="chip" data-f="Vencendo">Vencendo</button>
    <button class="chip" data-f="Caiu">Caídas</button>
    <span class="sep"></span>
    <button class="chip" data-f="fila">Com Fila</button>
    <button class="chip" data-f="parada">Sem Saída Marcada</button>
  </div>

  <div class="fichas" id="fichas" style="margin-top:18px"></div>

  <div class="pe-lista">
    <span class="pp" id="conta-linhas"></span>
    <div class="dir">
      <button class="bt mini" id="simular">Simular Rede De 24 Contas</button>
    </div>
  </div>

</section>
</main>

<script src="dados.js"></script>
<script>
(function(){
  var raiz = document.documentElement;
  document.getElementById('botao-menu').addEventListener('click', function(){
    var aberto = raiz.getAttribute('data-menu') === 'aberto';
    raiz.setAttribute('data-menu', aberto ? 'fechado' : 'aberto');
    this.setAttribute('aria-expanded', String(!aberto));
  });
  var chave = document.getElementById('chave');
  chave.addEventListener('click', function(){
    var escuro = raiz.getAttribute('data-theme') === 'dark';
    raiz.classList.add('trocando-tema');
    raiz.setAttribute('data-theme', escuro ? 'light' : 'dark');
    chave.setAttribute('aria-checked', String(!escuro));
    setTimeout(function(){ raiz.classList.remove('trocando-tema'); }, 340);
  });

  var HOJE = new Date(window.DADOS.hoje);
  var POSTS = window.DADOS.posts || {};
  var LINHAS = window.DADOS.contas.map(function(c){ return Object.assign({}, c); });
  var SIMULADAS = [];
  var mercados = ['corte de podcast','notícia','curiosidades','negócios','rotina','trading'];
  var etqs = ['principal','teste','aquecimento','volume'];
  for (var i = 0; i < 22; i++){
    var nasce = new Date(2026, 5 + (i % 3), 1 + (i * 3) % 27);
    var venc = new Date(nasce.getTime() + 60 * 864e5);
    var caiu = i % 7 === 3, quase = i % 7 === 5;
    if (quase) venc = new Date(HOJE.getTime() + (3 + i % 4) * 864e5);
    SIMULADAS.push({
      u:'conta.exemplo' + (i+1), nome:'Conta De Exemplo ' + (i+1), avatar:'',
      seguidores:[0,3,18,140,612,2400][i%6], publicacoes:(i*7)%61,
      mercado:mercados[i%mercados.length],
      etiquetas: i%3===0 ? [etqs[i%etqs.length]] : [],
      ligada:!caiu, conexao: caiu ? 'caiu' : 'viva',
      tetoUsado: caiu ? 0 : (i*11)%101, tetoTotal:100,
      ligadaEm:nasce.toISOString(), vence:venc.toISOString(),
      fila:(i*5)%37, erros24h: i%9===4 ? (i%3)+1 : 0,
      ultimo:new Date(HOJE.getTime() - ((i*4)%40)*864e5).toISOString(), simulada:true
    });
  }

  function dias(a,b){ return Math.round((new Date(b) - new Date(a)) / 864e5); }
  function dataCurta(d){ var x = new Date(d);
    return String(x.getDate()).padStart(2,'0') + '/' + String(x.getMonth()+1).padStart(2,'0'); }
  function faz(d){ var n = dias(d, HOJE);
    if (n <= 0) return 'hoje'; if (n === 1) return 'ontem';
    if (n < 30) return 'há ' + n + ' dias'; return 'há ' + Math.round(n/30) + ' meses'; }
  function num(n){ return (n||0).toLocaleString('pt-BR'); }
  var cores = ['var(--chart-1)','var(--chart-2)','var(--chart-3)','var(--chart-4)','var(--chart-5)'];

  function estadoConexao(c){
    if (c.conexao === 'caiu') return {classe:'ruim', texto:'Caiu'};
    if (dias(HOJE, c.vence) <= 14) return {classe:'', texto:'Vencendo'};
    return {classe:'ok', texto:'Viva'};
  }

  var comSimuladas = false, filtro = '', busca = '';
  function todas(){ return comSimuladas ? LINHAS.concat(SIMULADAS) : LINHAS; }
  function achaC(u){ return todas().filter(function(c){ return c.u === u; })[0]; }

  function filtradas(){
    return todas().filter(function(c){
      if (busca && (c.u + ' ' + c.nome).toLowerCase().indexOf(busca) === -1) return false;
      if (!filtro) return true;
      if (filtro === 'fila') return c.fila > 0;
      if (filtro === 'parada') return c.fila === 0;
      return estadoConexao(c).texto === filtro;
    });
  }

  function anel(c){
    var pct = c.tetoUsado / c.tetoTotal;
    var r = 24, vol = 2 * Math.PI * r;
    var tom = pct >= .8 ? ' cheio' : (pct >= .5 ? ' meio' : '');
    return '<div class="anel' + tom + '" title="Teto de publicação nas últimas 24 horas">' +
      '<svg viewBox="0 0 56 56"><circle class="trilho" cx="28" cy="28" r="' + r + '"/>' +
      '<circle class="arco" cx="28" cy="28" r="' + r + '" stroke-dasharray="' +
        (vol * pct).toFixed(1) + ' ' + vol.toFixed(1) + '"/></svg>' +
      '<span class="meio-texto"><b>' + c.tetoUsado + '</b><span>de ' + c.tetoTotal +
      '</span></span></div>';
  }

  /* AS CAPAS SÃO AS DE VERDADE, as mesmas que a Meta devolveu e que o publicador já
     guarda. Retângulo cinza com data escrita não deixa julgar nada. */
  function tiras(c){
    var lista = (POSTS[c.u] || []).slice(0, 4);
    var saida = lista.map(function(p){
      var fundo = p.capa ? ' style="background-image:url(' + p.capa + ');' +
                           'background-size:cover;background-position:center"' : '';
      return '<div class="tira"' + fundo + ' title="' + (p.legenda || 'Publicação') + '">' +
             '<em>' + dataCurta(p.quando) + ' · ' + num(p.views) + ' vistas</em></div>';
    });
    while (saida.length < 4) saida.push('<div class="tira vazia">sem post</div>');
    return '<div class="tiras">' + saida.join('') + '</div>';
  }

  function ficha(c, i){
    var con = estadoConexao(c);
    var faltam = dias(HOJE, c.vence);
    var total = Math.max(dias(c.ligadaEm, c.vence), 1);
    var pctAcesso = Math.max(0, Math.min(100, Math.round((total - faltam) / total * 100)));
    var corAcesso = faltam <= 7 ? ' class="ruim"' : (faltam <= 14 ? ' class="meio"' : '');
    var face = c.avatar
      ? '<img class="av" src="' + c.avatar + '" alt="">'
      : '<span class="av" style="background:' + cores[i % 5] + '">' +
        c.u.replace('@','').slice(0,2).toUpperCase() + '</span>';

    return '<article class="ficha' + (c.conexao === 'caiu' ? ' caida' : '') +
      (c.simulada ? ' simulada' : '') + '" data-conta="' + c.u + '">' +
      '<div class="ficha-cab">' + face +
        '<div class="quem"><div class="nome">@' + c.u + '</div>' +
        '<div class="pp">' + (c.nome || '') + '</div></div>' +
        anel(c) +
      '</div>' +
      '<div class="ficha-num">' +
        '<div><b>' + num(c.seguidores) + '</b><span>Seguidores</span></div>' +
        '<div><b>' + num(c.publicacoes) + '</b><span>Publicações</span></div>' +
        '<div><b>' + num(c.fila) + '</b><span>Na Fila</span></div>' +
        '<div><b class="' + (c.erros24h ? 'mau' : '') + '">' + num(c.erros24h) +
          '</b><span>Erros 24h</span></div>' +
      '</div>' +
      '<div class="ficha-corpo">' +
        '<div class="ficha-linha"><span class="rot">Conexão</span>' +
          '<span class="pino ' + con.classe + '">' + con.texto + '</span>' +
          '<span class="pp" data-checada="' + c.u + '" style="margin-left:auto">' +
          'testada agora</span></div>' +
        '<div class="ficha-linha"><span class="rot">Acesso Vence</span>' +
          '<div class="barra"><i' + corAcesso + ' style="width:' + pctAcesso + '%"></i></div>' +
          '<b>' + faltam + ' dias</b></div>' +
        '<div class="ficha-linha"><span class="rot">Última Saída</span>' +
          '<b style="margin-left:auto">' + faz(c.ultimo) + '</b></div>' +
        '<div class="ficha-linha"><span class="rot">Mercado</span>' +
          '<span class="campo' + (c.mercado ? '' : ' vazio') + '" data-mercado="' + c.u +
          '">' + (c.mercado || 'definir') + '</span></div>' +
        '<div class="ficha-linha" style="align-items:flex-start">' +
          '<span class="rot" style="padding-top:4px">Etiquetas</span>' +
          '<span class="etqs" data-etqs="' + c.u + '">' +
            c.etiquetas.map(function(t){
              return '<span class="etq">' + t + '<button data-tirar="' + t +
                     '" aria-label="Tirar ' + t + '">×</button></span>'; }).join('') +
            '<button class="etq-mais" data-por="' + c.u + '">+ etiqueta</button></span></div>' +
        tiras(c) +
      '</div>' +
      '<div class="ficha-pe">' +
        '<button class="bt mini" data-programar="' + c.u + '">Programar</button>' +
        '<div class="dir">' +
          '<button class="ic" data-testar="' + c.u + '" title="Testar a conexão">' +
            '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg></button>' +
          '<a class="ic" href="https://www.instagram.com/' + c.u + '/" target="_blank" ' +
            'rel="noopener" title="Abrir no Instagram"><svg viewBox="0 0 24 24">' +
            '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/>' +
            '<circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg></a>' +
          '<button class="ic" data-desligar="' + c.u + '" title="Desligar do publicador">' +
            '<svg viewBox="0 0 24 24"><path d="M12 4v8"/><path d="M6.3 7.3a8 8 0 1 0 11.4 0"/></svg></button>' +
        '</div>' +
      '</div></article>';
  }

  var caixa = document.getElementById('fichas');
  function desenhar(){
    var lista = filtradas();
    caixa.innerHTML = lista.length
      ? lista.map(ficha).join('')
      : '<div class="caixa"><div class="vazio">Nenhuma conta com esse filtro.</div></div>';
    document.getElementById('conta-linhas').textContent =
      lista.length + (lista.length === 1 ? ' conta na tela' : ' contas na tela');
  }

  document.querySelectorAll('.chip').forEach(function(ch){
    ch.addEventListener('click', function(){
      document.querySelectorAll('.chip').forEach(function(o){ o.classList.remove('on'); });
      ch.classList.add('on'); filtro = ch.dataset.f; desenhar();
    });
  });
  var campoBusca = document.getElementById('busca'), limpar = document.getElementById('limpar');
  campoBusca.addEventListener('input', function(){
    busca = campoBusca.value.trim().toLowerCase();
    limpar.hidden = !campoBusca.value; desenhar();
  });
  limpar.addEventListener('click', function(){
    campoBusca.value = ''; busca = ''; limpar.hidden = true; desenhar(); campoBusca.focus();
  });

  caixa.addEventListener('click', function(e){
    var m = e.target.closest('[data-mercado]');
    if (m && !m.querySelector('input')){
      var c = achaC(m.dataset.mercado);
      m.classList.remove('vazio');
      m.innerHTML = '<input value="' + (c.mercado || '').replace(/"/g,'&quot;') +
                    '" placeholder="mercado">';
      var campo = m.querySelector('input'); campo.focus(); campo.select();
      campo.addEventListener('blur', function(){ c.mercado = campo.value.trim(); desenhar(); });
      campo.addEventListener('keydown', function(ev){
        if (ev.key === 'Enter') campo.blur();
        if (ev.key === 'Escape'){ campo.value = c.mercado || ''; campo.blur(); }
      });
      return;
    }
    var tirar = e.target.closest('[data-tirar]');
    if (tirar){
      var cx = tirar.closest('[data-etqs]'), conta = achaC(cx.dataset.etqs);
      conta.etiquetas = conta.etiquetas.filter(function(t){ return t !== tirar.dataset.tirar; });
      return desenhar();
    }
    var por = e.target.closest('[data-por]');
    if (por){
      var cc = por.closest('[data-etqs]'), qual = achaC(cc.dataset.etqs);
      por.outerHTML = '<input class="etq-novo" placeholder="etiqueta">';
      var novo = cc.querySelector('.etq-novo');
      novo.style.cssText = 'border:1px dashed var(--rule-solid);border-radius:999px;' +
        'padding:3px 10px;font:inherit;font-size:11.5px;width:105px;outline:none;' +
        'background:none;color:var(--ink)';
      novo.focus();
      novo.addEventListener('blur', function(){
        var v = novo.value.trim().toLowerCase();
        if (v && qual.etiquetas.indexOf(v) === -1) qual.etiquetas.push(v);
        desenhar();
      });
      novo.addEventListener('keydown', function(ev){
        if (ev.key === 'Enter') novo.blur();
        if (ev.key === 'Escape'){ novo.value = ''; novo.blur(); }
      });
      return;
    }
    var testar = e.target.closest('[data-testar]');
    if (testar){
      testar.classList.add('girando');
      var alvo = document.querySelector('[data-checada="' + testar.dataset.testar + '"]');
      if (alvo) alvo.textContent = 'perguntando à Meta…';
      setTimeout(function(){
        testar.classList.remove('girando');
        if (alvo) alvo.textContent = 'testada agora';
      }, 1100);
      return;
    }
    var desligar = e.target.closest('[data-desligar]');
    if (desligar){
      var alvo2 = achaC(desligar.dataset.desligar);
      alvo2.conexao = alvo2.conexao === 'caiu' ? 'viva' : 'caiu';
      alvo2.ligada = alvo2.conexao !== 'caiu';
      return desenhar();
    }
    var prog = e.target.closest('[data-programar]');
    if (prog){
      var b = prog, txt = b.textContent;
      b.textContent = 'Abrindo O Assistente…';
      setTimeout(function(){ b.textContent = txt; }, 1100);
    }
  });

  document.getElementById('testar-todas').addEventListener('click', function(){
    var b = this, antes = b.textContent;
    b.textContent = 'Perguntando À Meta…'; b.disabled = true;
    document.querySelectorAll('[data-checada]').forEach(function(s){
      s.textContent = 'perguntando…'; });
    setTimeout(function(){
      b.textContent = antes; b.disabled = false;
      document.querySelectorAll('[data-checada]').forEach(function(s){
        s.textContent = 'testada agora'; });
    }, 1400);
  });
  document.getElementById('ligar').addEventListener('click', function(){
    var b = this; b.textContent = 'Abrindo O Instagram…';
    setTimeout(function(){ b.textContent = 'Ligar Conta'; }, 1200);
  });
  document.getElementById('simular').addEventListener('click', function(){
    comSimuladas = !comSimuladas;
    this.textContent = comSimuladas ? 'Voltar Às Contas Reais' : 'Simular Rede De 24 Contas';
    desenhar();
  });

  desenhar();
})();
</script>
</body>
</html>
