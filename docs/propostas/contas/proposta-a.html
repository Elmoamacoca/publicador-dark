<!doctype html>
<html lang="pt-BR" data-theme="light" data-menu="fechado">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Contas · Proposta A · Publicador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="painel.css">
<style>
/* ---------------------------------------------- PROPOSTA A: a tabela que decide
   Nada de componente novo: o que entra aqui e' o que a tabela da casa ainda nao tinha,
   escrito com as mesmas variaveis. */

/* O cabeçalho de coluna vira botão de ordenar. Ele já é maiúsculo pelo estilo da casa. */
th.ord{cursor:pointer;user-select:none;white-space:nowrap}
th.ord:hover{color:var(--muted)}
th.ord i{font-style:normal;opacity:0;margin-left:5px;font-size:10px}
th.ord.on i{opacity:1}

/* A validade do acesso: barra fina com o quanto da janela de 60 dias já correu. */
.acesso{display:flex;flex-direction:column;gap:6px;min-width:112px}
.acesso .barra{height:6px}
.acesso .quanto{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.acesso .quando{font-size:11.5px;color:var(--soft)}
.barra i.ruim{background:var(--vermelho)}

/* Teto do dia, no corpo da linha: quantas publicações a Meta ainda aceita hoje. */
.teto{display:flex;align-items:center;gap:9px;justify-content:flex-end}
.teto .barra{width:56px;height:6px}

/* A COLUNA DE AÇÃO NÃO ROLA. Com doze colunas a tabela passa da tela em monitor de
   1440, e o botão de testar era o primeiro a sumir. Presa na direita, ela está sempre
   ao alcance, e o que rola é o meio. */
th:last-child, td:last-child{position:sticky;right:0;z-index:2;
  background:var(--branco);
  box-shadow:-14px 0 14px -12px rgba(14,14,14,.14)}
tbody tr:hover td:last-child{background:color-mix(in srgb,var(--paper-2) 96%,var(--branco))}
.acoes{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
.ic{width:34px;height:34px;border-radius:999px;border:1px solid var(--rule-solid);
    background:var(--branco);color:var(--muted);cursor:pointer;display:grid;
    place-items:center;padding:0;transition:.15s}
.ic:hover{border-color:var(--soft);color:var(--ink);background:var(--paper-2)}
.ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;
        stroke-linecap:round;stroke-linejoin:round}
.ic.girando svg{animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* Linha de conta simulada: ela existe para julgar a tabela cheia, e diz isso. */
tr.simulada td{background:color-mix(in srgb,var(--ambar) 4%,transparent)}
tr.simulada .perfil .nome::after{content:"Simulada";margin-left:8px;font-size:10px;
  font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ambar);
  background:color-mix(in srgb,var(--ambar) 13%,transparent);padding:2px 7px;
  border-radius:999px;vertical-align:middle}

.pe-caixa{display:flex;align-items:center;gap:12px;padding:14px 20px;
          border-top:1px solid var(--rule-solid);flex-wrap:wrap}
.pe-caixa .dir{margin-left:auto;display:flex;gap:8px;align-items:center}

.cel-conexao{display:flex;flex-direction:column;gap:5px}
.cel-conexao .pp{white-space:nowrap}
.aviso-topo{display:flex;align-items:center;gap:10px;padding:12px 16px;margin-bottom:16px;
  border-radius:var(--r-md);font-size:13.5px;
  background:color-mix(in srgb,var(--ambar) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--ambar) 32%,transparent);color:var(--ink)}
.aviso-topo b{font-weight:800}
.aviso-topo .bt{margin-left:auto}
.aviso-topo svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--ambar);
                stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<svg class="tinta" aria-hidden="true">
  <symbol id="i-seta" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></symbol>
  <symbol id="i-ig" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5.4"/>
      <circle cx="12" cy="12" r="4.2"/></g>
    <circle cx="17.4" cy="6.6" r="1.35" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="i-agenda" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/>
      <path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></g>
  </symbol>
</svg>

<aside class="menu" aria-label="Menu do Publicador">
  <div class="menu-marca">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
      <circle cx="14" cy="14" r="12" fill="none" stroke="var(--ink)" stroke-width="2.4"/>
      <circle cx="14" cy="14" r="4.6" fill="var(--accent)"/>
    </svg>
    <span class="menu-nome">Publicador</span>
  </div>
  <button class="menu-botao" id="botao-menu" aria-expanded="false"
          aria-label="Abrir ou fechar o menu">
    <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <nav class="menu-rolo" id="menu">
    <button class="mi" data-pag="painel">
      <svg class="mi-ic" viewBox="0 0 24 24"><rect x="3" y="3.5" width="7.5" height="9" rx="1.6"/><rect x="13.5" y="3.5" width="7.5" height="5" rx="1.6"/><rect x="3" y="15.5" width="7.5" height="5" rx="1.6"/><rect x="13.5" y="11.5" width="7.5" height="9" rx="1.6"/></svg>
      <span class="mi-rot">Painel</span>
    </button>
    <button class="mi" data-pag="calendario">
      <svg class="mi-ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span class="mi-rot">Calendário</span>
    </button>
    <button class="mi" data-pag="midia">
      <svg class="mi-ic" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M7 5 6 9M13 5l-1 4M21.5 9h-19"/></svg>
      <span class="mi-rot">Mídia</span>
    </button>
    <button class="mi" data-pag="analytics">
      <svg class="mi-ic" viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="M8 16v-5M13 16V7M18 16v-8"/></svg>
      <span class="mi-rot">Analytics</span>
    </button>
    <button class="mi ativo" data-pag="contas">
      <svg class="mi-ic" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c0-3.7 3.3-6 7.5-6s7.5 2.3 7.5 6"/></svg>
      <span class="mi-rot">Contas</span>
    </button>
  </nav>
  <div class="menu-acao" style="padding:8px">
    <button class="btn brasa" type="button" aria-label="Programar publicações">
      <svg class="seta seta-esq" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
      <span class="txt"><svg class="ig-selo" aria-hidden="true"><use href="#i-agenda"/></svg>
        <span class="ag-rot">Programar</span></span>
      <span class="circ"></span>
      <svg class="seta seta-dir" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
    </button>
  </div>
  <div class="menu-pe">
    <button class="mi" data-pag="ajuda">
      <svg class="mi-ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.8-.9 1.4v.4"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
      <span class="mi-rot">Ajuda</span>
    </button>
    <div class="pe-linha">
      <span class="pp" style="font-weight:700;font-variant-numeric:tabular-nums">A</span>
      <span class="pe-rot">proposta</span>
    </div>
    <div class="pe-linha">
      <svg class="tema-icone" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      <span class="pe-rot">tema</span>
      <button class="chave" id="chave" role="switch" aria-checked="false"
              aria-label="Trocar tema"><i></i></button>
    </div>
  </div>
</aside>

<main class="palco">
<section class="pagina ativa" id="pag-contas">

  <div class="cab">
    <div>
      <h1>Contas</h1>
      <p class="p" id="sub">Os perfis ligados ao publicador.</p>
    </div>
    <div class="dir">
      <span class="pp" id="lido"></span>
      <button class="bt mini" id="testar-todas">Testar Conexões</button>
      <button class="bt forte" id="ligar">Ligar Conta</button>
    </div>
  </div>

  <div id="aviso"></div>

  <div class="scards" id="cartoes"></div>

  <div class="filtros" style="margin-top:22px">
    <div class="ac">
      <div class="ac-campo">
        <svg class="ac-lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/>
             <path d="M20 20l-3.5-3.5"/></svg>
        <input id="busca" type="text" autocomplete="off" spellcheck="false"
               placeholder="Buscar conta pelo arroba">
        <button class="ac-limpar" id="limpar" type="button" hidden aria-label="Limpar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>

    <div class="sel" id="sel-mercado">
      <button class="sel-gatilho" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="sel-valor" data-vazio="true">Todos Os Mercados</span>
        <svg class="sel-seta" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="sel-lista" role="listbox"><div class="sel-grupo"></div></div>
    </div>

    <div class="sel" id="sel-conexao">
      <button class="sel-gatilho" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="sel-valor" data-vazio="true">Toda Conexão</span>
        <svg class="sel-seta" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="sel-lista" role="listbox"><div class="sel-grupo"></div></div>
    </div>
  </div>

  <div class="caixa solta" style="margin-top:14px">
    <div class="rolagem">
      <table>
        <thead><tr>
          <th class="ord" data-ord="arroba">Conta <i>↑</i></th>
          <th>Mercado</th>
          <th>Etiquetas</th>
          <th class="ord" data-ord="conexao">Conexão <i>↑</i></th>
          <th class="ord" data-ord="vence">Acesso Vence <i>↑</i></th>
          <th class="ord n" data-ord="seguidores">Seguidores <i>↑</i></th>
          <th class="ord n" data-ord="publicacoes">Publicações <i>↑</i></th>
          <th class="ord n" data-ord="ultimo">Última Saída <i>↑</i></th>
          <th class="n">Teto De Hoje</th>
          <th class="ord n" data-ord="fila">Fila <i>↑</i></th>
          <th class="ord n" data-ord="erros24h">Erros 24h <i>↑</i></th>
          <th class="n"></th>
        </tr></thead>
        <tbody id="corpo"></tbody>
      </table>
    </div>
    <div class="pe-caixa">
      <span class="pp" id="conta-linhas"></span>
      <div class="dir">
        <button class="bt mini" id="simular">Simular Rede De 24 Contas</button>
      </div>
    </div>
  </div>

</section>
</main>

<script src="dados.js"></script>
<script>
(function(){
  var raiz = document.documentElement;

  /* ------------------------------------------------------------------ menu e tema */
  document.getElementById('botao-menu').addEventListener('click', function(){
    var aberto = raiz.getAttribute('data-menu') === 'aberto';
    raiz.setAttribute('data-menu', aberto ? 'fechado' : 'aberto');
    this.setAttribute('aria-expanded', String(!aberto));
  });
  var chave = document.getElementById('chave');
  chave.addEventListener('click', function(){
    var escuro = raiz.getAttribute('data-theme') === 'dark';
    raiz.classList.add('trocando-tema');
    raiz.setAttribute('data-theme', escuro ? 'light' : 'dark');
    chave.setAttribute('aria-checked', String(!escuro));
    setTimeout(function(){ raiz.classList.remove('trocando-tema'); }, 340);
  });
  document.querySelectorAll('.mi').forEach(function(b){
    b.addEventListener('click', function(){
      if (b.dataset.pag === 'contas') return;
      document.querySelectorAll('.mi').forEach(function(o){ o.classList.remove('ativo'); });
      b.classList.add('ativo');
      setTimeout(function(){
        document.querySelectorAll('.mi').forEach(function(o){ o.classList.remove('ativo'); });
        document.querySelector('[data-pag="contas"]').classList.add('ativo');
      }, 900);
    });
  });

  /* ------------------------------------------------------------------ os dados */
  var HOJE = new Date(window.DADOS.hoje);
  var LINHAS = window.DADOS.contas.map(function(c){ return Object.assign({}, c); });
  var SIMULADAS = [];
  var mercados = ['corte de podcast','notícia','curiosidades','negócios','rotina','trading'];
  var etqs = ['principal','teste','aquecimento','volume'];
  for (var i = 0; i < 22; i++){
    var nasce = new Date(2026, 5 + (i % 3), 1 + (i * 3) % 27);
    var venc = new Date(nasce.getTime() + 60 * 864e5);
    var caiu = i % 7 === 3, quase = i % 7 === 5;
    if (quase) venc = new Date(HOJE.getTime() + (3 + i % 4) * 864e5);
    SIMULADAS.push({
      u: 'conta.exemplo' + (i + 1), nome: 'Conta De Exemplo ' + (i + 1), avatar: '',
      seguidores: [0,3,18,140,612,2400][i % 6], publicacoes: (i * 7) % 61,
      mercado: mercados[i % mercados.length],
      etiquetas: i % 3 === 0 ? [etqs[i % etqs.length]] : [],
      ligada: !caiu, conexao: caiu ? 'caiu' : 'viva',
      tetoUsado: caiu ? 0 : (i * 11) % 101, tetoTotal: 100,
      ligadaEm: nasce.toISOString(), vence: venc.toISOString(),
      fila: (i * 5) % 37, erros24h: i % 9 === 4 ? (i % 3) + 1 : 0,
      ultimo: new Date(HOJE.getTime() - ((i * 4) % 40) * 864e5).toISOString(),
      simulada: true
    });
  }

  /* ------------------------------------------------------------------ formatos */
  function dias(a, b){ return Math.round((new Date(b) - new Date(a)) / 864e5); }
  function dataCurta(d){
    var x = new Date(d);
    return String(x.getDate()).padStart(2,'0') + '/' + String(x.getMonth()+1).padStart(2,'0');
  }
  function faz(d){
    var n = dias(d, HOJE);
    if (n <= 0) return 'hoje';
    if (n === 1) return 'ontem';
    if (n < 30) return 'há ' + n + ' dias';
    return 'há ' + Math.round(n / 30) + ' meses';
  }
  function num(n){ return (n || 0).toLocaleString('pt-BR'); }
  function inicial(u){ return u.replace('@','').slice(0,2).toUpperCase(); }
  var cores = ['var(--chart-1)','var(--chart-2)','var(--chart-3)','var(--chart-4)','var(--chart-5)'];

  function perfil(c, i){
    var face = c.avatar
      ? '<img class="av" src="' + c.avatar + '" alt="">'
      : '<span class="av" style="background:' + cores[i % 5] + '">' + inicial(c.u) + '</span>';
    return '<div class="perfil">' + face + '<div><div class="nome">@' + c.u + '</div>' +
           '<div class="pp">' + (c.nome || '') + '</div></div></div>';
  }

  /* A CONEXÃO É O ESTADO DA CHAMADA, e não a repetição de "está ligada". Viva quer dizer
     que a Meta respondeu; vencendo, que o acesso morre em menos de duas semanas. */
  function estadoConexao(c){
    if (c.conexao === 'caiu') return {classe:'ruim', texto:'Caiu'};
    var faltam = dias(HOJE, c.vence);
    if (faltam <= 14) return {classe:'', texto:'Vencendo'};
    return {classe:'ok', texto:'Viva'};
  }

  function celulaAcesso(c){
    var faltam = dias(HOJE, c.vence);
    var total = Math.max(dias(c.ligadaEm, c.vence), 1);
    var pct = Math.max(0, Math.min(100, Math.round((total - faltam) / total * 100)));
    var cor = faltam <= 7 ? ' class="ruim"' : (faltam <= 14 ? ' class="meio"' : '');
    return '<div class="acesso"><span class="quanto">' + faltam + ' dias</span>' +
           '<div class="barra"><i' + cor + ' style="width:' + pct + '%"></i></div>' +
           '<span class="quando">até ' + dataCurta(c.vence) + '</span></div>';
  }

  function celulaTeto(c){
    var pct = Math.round(c.tetoUsado / c.tetoTotal * 100);
    var cor = pct >= 80 ? ' class="ruim"' : (pct >= 50 ? ' class="meio"' : '');
    return '<div class="teto"><div class="barra"><i' + cor + ' style="width:' + pct + '%"></i></div>' +
           '<b style="font-size:15px">' + c.tetoUsado + '</b>' +
           '<span class="pp">de ' + c.tetoTotal + '</span></div>';
  }

  function celulaMercado(c){
    return '<span class="campo' + (c.mercado ? '' : ' vazio') + '" data-mercado="' + c.u +
           '">' + (c.mercado || 'definir') + '</span>';
  }
  function celulaEtiquetas(c){
    return '<span class="etqs" data-etqs="' + c.u + '">' +
      c.etiquetas.map(function(t){
        return '<span class="etq">' + t + '<button data-tirar="' + t +
               '" aria-label="Tirar ' + t + '">×</button></span>';
      }).join('') +
      '<button class="etq-mais" data-por="' + c.u + '">+ etiqueta</button></span>';
  }

  /* ------------------------------------------------------------------ estado da tela */
  var ordem = {campo:'arroba', desc:false};
  var filtro = {busca:'', mercado:'', conexao:''};
  var comSimuladas = false;

  function todas(){ return comSimuladas ? LINHAS.concat(SIMULADAS) : LINHAS; }

  function filtradas(){
    return todas().filter(function(c){
      if (filtro.busca && (c.u + ' ' + c.nome).toLowerCase().indexOf(filtro.busca) === -1)
        return false;
      if (filtro.mercado && c.mercado !== filtro.mercado) return false;
      if (filtro.conexao && estadoConexao(c).texto !== filtro.conexao) return false;
      return true;
    }).sort(function(a, b){
      var k = ordem.campo, va, vb;
      if (k === 'arroba'){ va = a.u; vb = b.u; }
      else if (k === 'conexao'){ va = estadoConexao(a).texto; vb = estadoConexao(b).texto; }
      else if (k === 'vence' || k === 'ultimo'){ va = new Date(a[k]); vb = new Date(b[k]); }
      else { va = a[k] || 0; vb = b[k] || 0; }
      if (va < vb) return ordem.desc ? 1 : -1;
      if (va > vb) return ordem.desc ? -1 : 1;
      return 0;
    });
  }

  var corpo = document.getElementById('corpo');
  function desenhar(){
    var lista = filtradas();
    corpo.innerHTML = '';
    if (!lista.length){
      corpo.innerHTML = '<tr><td colspan="12"><div class="vazio">' +
        'Nenhuma conta com esse filtro.</div></td></tr>';
    }
    lista.forEach(function(c, i){
      var con = estadoConexao(c);
      var tr = document.createElement('tr');
      if (c.simulada) tr.className = 'simulada';
      tr.innerHTML =
        '<td>' + perfil(c, i) + '</td>' +
        '<td>' + celulaMercado(c) + '</td>' +
        '<td>' + celulaEtiquetas(c) + '</td>' +
        '<td><div class="cel-conexao"><span class="pino ' + con.classe + '">' + con.texto +
          '</span><span class="pp" data-checada="' + c.u + '">testada agora</span></div></td>' +
        '<td>' + celulaAcesso(c) + '</td>' +
        '<td class="n">' + num(c.seguidores) + '</td>' +
        '<td class="n">' + num(c.publicacoes) + '</td>' +
        '<td class="n" style="font-size:13.5px;font-weight:600">' + faz(c.ultimo) + '</td>' +
        '<td class="n">' + celulaTeto(c) + '</td>' +
        '<td class="n">' + (c.fila ? c.fila : '<span class="pp">0</span>') + '</td>' +
        '<td class="n">' + (c.erros24h
            ? '<span class="pino ruim">' + c.erros24h + '</span>'
            : '<span class="pp">0</span>') + '</td>' +
        '<td class="n"><div class="acoes">' +
          '<button class="ic" data-testar="' + c.u + '" title="Testar a conexão">' +
            '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg></button>' +
          '<a class="ic" href="https://www.instagram.com/' + c.u + '/" target="_blank" ' +
            'rel="noopener" title="Abrir no Instagram"><svg viewBox="0 0 24 24">' +
            '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/>' +
            '<circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg></a>' +
          '<button class="ic" data-desligar="' + c.u + '" title="Desligar do publicador">' +
            '<svg viewBox="0 0 24 24"><path d="M12 4v8"/><path d="M6.3 7.3a8 8 0 1 0 11.4 0"/></svg></button>' +
        '</div></td>';
      corpo.appendChild(tr);
    });
    document.getElementById('conta-linhas').textContent =
      lista.length + (lista.length === 1 ? ' conta na tela' : ' contas na tela');
    cartoes();
  }

  /* ------------------------------------------------------------------ os quatro números */
  function cartoes(){
    var lista = todas();
    var vivas = lista.filter(function(c){ return estadoConexao(c).texto === 'Viva'; }).length;
    var vencendo = lista.filter(function(c){ return estadoConexao(c).texto === 'Vencendo'; }).length;
    var caidas = lista.filter(function(c){ return c.conexao === 'caiu'; }).length;
    var usado = lista.reduce(function(s, c){ return s + c.tetoUsado; }, 0);
    var teto = lista.reduce(function(s, c){ return s + c.tetoTotal; }, 0);
    var fila = lista.reduce(function(s, c){ return s + c.fila; }, 0);
    function card(valor, sufixo, titulo, nota, tom){
      return '<div class="scard"><div class="valor"><h3>' + valor + '</h3>' +
        (sufixo ? '<span>' + sufixo + '</span>' : '') + '</div>' +
        '<div class="tit">' + titulo + '</div>' +
        (nota ? '<div class="mud ' + (tom || '') + '"><p>' + nota + '</p></div>' : '') + '</div>';
    }
    document.getElementById('cartoes').innerHTML =
      card(lista.length, '', 'Contas Ligadas', 'Todas respondendo à Meta agora') +
      card(vivas, 'de ' + lista.length, 'Conexão Viva',
           (vencendo ? vencendo + ' vencendo em duas semanas' : 'Nenhuma vencendo') +
           (caidas ? ' · ' + caidas + (caidas === 1 ? ' caída' : ' caídas') : '')) +
      card(usado, 'de ' + num(teto), 'Publicações Usadas Hoje', 'Teto da Meta por 24 horas') +
      card(fila, '', 'Vídeos Na Fila', fila ? 'Marcados no livro-caixa' : 'Nenhuma saída marcada');
  }

  /* ------------------------------------------------------------------ o aviso do topo */
  function aviso(){
    var lista = todas();
    var quantas = lista.filter(function(c){ return dias(HOJE, c.vence) <= 60; }).length;
    var maisCedo = lista.slice().sort(function(a, b){
      return new Date(a.vence) - new Date(b.vence); })[0];
    if (!maisCedo) return;
    document.getElementById('aviso').innerHTML =
      '<div class="aviso-topo"><svg viewBox="0 0 24 24"><path d="M12 9v4"/>' +
      '<circle cx="12" cy="16.6" r=".7" fill="currentColor" stroke="none"/>' +
      '<path d="M10.3 3.9 2.4 17.5A1.9 1.9 0 0 0 4 20.4h16a1.9 1.9 0 0 0 1.6-2.9L13.7 3.9a1.9 1.9 0 0 0-3.4 0Z"/></svg>' +
      '<span>O acesso do Instagram vale <b>60 dias</b>. ' +
      (quantas === 1
        ? 'Uma conta vence a partir de <b>' + dataCurta(maisCedo.vence) +
          '</b> e precisa ser religada antes disso.'
        : quantas + ' contas vencem a partir de <b>' + dataCurta(maisCedo.vence) +
          '</b> e precisam ser religadas antes disso.') + '</span>' +
      '<button class="bt mini" id="renovar">Renovar Acessos</button></div>';
    document.getElementById('renovar').addEventListener('click', function(){
      this.textContent = 'Renovando…';
      var b = this;
      setTimeout(function(){
        todas().forEach(function(c){
          c.vence = new Date(HOJE.getTime() + 60 * 864e5).toISOString();
          c.ligadaEm = HOJE.toISOString();
        });
        b.textContent = 'Renovados';
        desenhar(); aviso();
      }, 900);
    });
  }

  /* ------------------------------------------------------------------ ordenar */
  document.querySelectorAll('th.ord').forEach(function(th){
    th.addEventListener('click', function(){
      if (ordem.campo === th.dataset.ord) ordem.desc = !ordem.desc;
      else { ordem.campo = th.dataset.ord; ordem.desc = false; }
      document.querySelectorAll('th.ord').forEach(function(o){ o.classList.remove('on'); });
      th.classList.add('on');
      th.querySelector('i').textContent = ordem.desc ? '↓' : '↑';
      desenhar();
    });
  });

  /* ------------------------------------------------------------------ busca */
  var busca = document.getElementById('busca'), limpar = document.getElementById('limpar');
  busca.addEventListener('input', function(){
    filtro.busca = busca.value.trim().toLowerCase();
    limpar.hidden = !busca.value;
    desenhar();
  });
  limpar.addEventListener('click', function(){
    busca.value = ''; filtro.busca = ''; limpar.hidden = true; desenhar(); busca.focus();
  });

  /* ------------------------------------------------------------------ os dois menus */
  function menu(id, campo, rotuloVazio, opcoes){
    var caixa = document.getElementById(id);
    var gatilho = caixa.querySelector('.sel-gatilho');
    var lista = caixa.querySelector('.sel-lista');
    var grupo = caixa.querySelector('.sel-grupo');
    var valor = caixa.querySelector('.sel-valor');
    function encher(){
      grupo.innerHTML = '';
      [{v:'', r:rotuloVazio}].concat(opcoes()).forEach(function(o){
        var b = document.createElement('button');
        b.className = 'sel-item' + (filtro[campo] === o.v ? ' marcado' : '');
        b.type = 'button';
        b.style.cursor = 'pointer';
        b.innerHTML = '<span class="sel-item-texto">' + o.r + '</span>' +
          (filtro[campo] === o.v
            ? '<span class="sel-marca"><svg viewBox="0 0 24 24" fill="none" ' +
              'stroke="currentColor" stroke-width="2.4" stroke-linecap="round" ' +
              'stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>'
            : '');
        b.addEventListener('click', function(){
          filtro[campo] = o.v;
          valor.textContent = o.v ? o.r : rotuloVazio;
          valor.setAttribute('data-vazio', String(!o.v));
          lista.classList.remove('aberta');
          gatilho.setAttribute('aria-expanded', 'false');
          desenhar();
        });
        grupo.appendChild(b);
      });
    }
    gatilho.addEventListener('click', function(e){
      e.stopPropagation();
      document.querySelectorAll('.sel-lista').forEach(function(o){
        if (o !== lista) o.classList.remove('aberta'); });
      encher();
      var abre = !lista.classList.contains('aberta');
      lista.classList.toggle('aberta', abre);
      gatilho.setAttribute('aria-expanded', String(abre));
    });
  }
  menu('sel-mercado', 'mercado', 'Todos Os Mercados', function(){
    var vistos = [];
    todas().forEach(function(c){
      if (c.mercado && vistos.indexOf(c.mercado) === -1) vistos.push(c.mercado); });
    return vistos.sort().map(function(m){ return {v:m, r:m}; });
  });
  menu('sel-conexao', 'conexao', 'Toda Conexão', function(){
    return [{v:'Viva', r:'Viva'}, {v:'Vencendo', r:'Vencendo'}, {v:'Caiu', r:'Caiu'}];
  });
  document.addEventListener('click', function(){
    document.querySelectorAll('.sel-lista').forEach(function(o){ o.classList.remove('aberta'); });
  });

  /* ------------------------------------------------------------------ editar na célula */
  function acha(u){
    var t = todas().filter(function(c){ return c.u === u; }); return t[0];
  }
  document.getElementById('pag-contas').addEventListener('click', function(e){
    var m = e.target.closest('[data-mercado]');
    if (m && !m.querySelector('input')){
      var c = acha(m.dataset.mercado);
      m.classList.remove('vazio');
      m.innerHTML = '<input value="' + (c.mercado || '').replace(/"/g,'&quot;') +
                    '" placeholder="mercado">';
      var campo = m.querySelector('input');
      campo.focus(); campo.select();
      var fim = function(){ c.mercado = campo.value.trim(); desenhar(); };
      campo.addEventListener('blur', fim);
      campo.addEventListener('keydown', function(ev){
        if (ev.key === 'Enter') campo.blur();
        if (ev.key === 'Escape'){ campo.value = c.mercado || ''; campo.blur(); }
      });
      return;
    }
    var tirar = e.target.closest('[data-tirar]');
    if (tirar){
      var cx = tirar.closest('[data-etqs]');
      var conta = acha(cx.dataset.etqs);
      conta.etiquetas = conta.etiquetas.filter(function(t){ return t !== tirar.dataset.tirar; });
      return desenhar();
    }
    var por = e.target.closest('[data-por]');
    if (por){
      var caixa = por.closest('[data-etqs]'), qual = acha(caixa.dataset.etqs);
      por.outerHTML = '<input class="etq-novo" placeholder="nome da etiqueta">';
      var novo = caixa.querySelector('.etq-novo');
      novo.style.cssText = 'border:1px dashed var(--rule-solid);border-radius:999px;' +
        'padding:4px 10px;font:inherit;font-size:12px;width:120px;outline:none;' +
        'background:none;color:var(--ink)';
      novo.focus();
      var fechar = function(){
        var v = novo.value.trim().toLowerCase();
        if (v && qual.etiquetas.indexOf(v) === -1) qual.etiquetas.push(v);
        desenhar();
      };
      novo.addEventListener('blur', fechar);
      novo.addEventListener('keydown', function(ev){
        if (ev.key === 'Enter') novo.blur();
        if (ev.key === 'Escape'){ novo.value = ''; novo.blur(); }
      });
      return;
    }
    var testar = e.target.closest('[data-testar]');
    if (testar){
      testar.classList.add('girando');
      var alvo = document.querySelector('[data-checada="' + testar.dataset.testar + '"]');
      if (alvo) alvo.textContent = 'perguntando à Meta…';
      setTimeout(function(){
        testar.classList.remove('girando');
        if (alvo) alvo.textContent = 'testada agora';
      }, 1100);
      return;
    }
    var desligar = e.target.closest('[data-desligar]');
    if (desligar){
      var quem = desligar.dataset.desligar;
      var linha = desligar.closest('tr');
      linha.style.transition = 'opacity .25s'; linha.style.opacity = '.35';
      setTimeout(function(){
        var alvo2 = acha(quem);
        alvo2.conexao = alvo2.conexao === 'caiu' ? 'viva' : 'caiu';
        alvo2.ligada = alvo2.conexao !== 'caiu';
        desenhar();
      }, 250);
    }
  });

  /* ------------------------------------------------------------------ os dois botões */
  document.getElementById('testar-todas').addEventListener('click', function(){
    var b = this, antes = b.textContent;
    b.textContent = 'Perguntando À Meta…'; b.disabled = true;
    document.querySelectorAll('[data-checada]').forEach(function(s){
      s.textContent = 'perguntando…'; });
    setTimeout(function(){
      b.textContent = antes; b.disabled = false;
      document.querySelectorAll('[data-checada]').forEach(function(s){
        s.textContent = 'testada agora'; });
      document.getElementById('lido').textContent = 'conferido agora';
    }, 1400);
  });
  document.getElementById('ligar').addEventListener('click', function(){
    var b = this;
    b.textContent = 'Abrindo O Instagram…';
    setTimeout(function(){ b.textContent = 'Ligar Conta'; }, 1200);
  });
  document.getElementById('simular').addEventListener('click', function(){
    comSimuladas = !comSimuladas;
    this.textContent = comSimuladas ? 'Voltar Às Contas Reais' : 'Simular Rede De 24 Contas';
    desenhar(); aviso();
  });

  document.getElementById('lido').textContent = 'conferido agora';
  document.getElementById('sub').textContent =
    'Os perfis ligados ao publicador, com o estado da conexão perguntado à Meta.';
  desenhar();
  aviso();
})();
</script>
</body>
</html>
